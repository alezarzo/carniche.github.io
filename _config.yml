title: "CarNiche"
logo: "/assets/images/Logo.jpg"
description: "Carnivore ecological Niche modeling research group"
remote_theme: mmistakes/minimal-mistakes
plugins:
  - jekyll-include-cache
minimal_mistakes_skin: "default"
url: "https://alezarzo.github.io"
baseurl: "/carniche.github.io/"
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      header:
        og_image: "/assets/images/Logo.jpg"
head:
  - '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">'
  - '<style>.masthead .site-logo img { height: 70px !important; width: auto !important; }</style>'
  - '<style>.page__content, .page__content p, .page__content li { text-align: justify !important; }</style>'
